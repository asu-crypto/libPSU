# server information
server_name = server
server_ip = 127.0.0.1
server_port = 9002

# client information
client_name = client
client_ip = 127.0.0.1
client_port = 9003

# append string in the output file
append_string = css25_example

# protocol type
pto_type = PSU

# protocol config
element_byte_length = 16
# Smaller sizes for circuit-PSI PSU (MainPsuTest uses this file for ASIACCS:CSSW25 only)
server_log_set_size = 8,6
client_log_set_size = 8,6
parallel = true

# PSU name
psu_pto_name = ASIACCS:CSSW25

# Optional CCPSI backend override. Default ASIACCS:CSSW25 is the runnable PSTY19 proxy; set
# css25_paper_comparison = true instead for the slower RS21 comparison proxy.
ccpsi_pto_name = PSTY19
silent_cot = true

compress_encode = true
