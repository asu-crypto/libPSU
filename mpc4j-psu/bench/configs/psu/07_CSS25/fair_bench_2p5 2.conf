# Fair benchmark (2^5 = 32 x 32).
# the paper's RR22 / volePSI backend) + LLL24 ROSN ShTr + Fig. 12 CnP + silent core-COT.
#
# Note: this conf reflects the new MPC4J "paper-comparison" default (RS21 became the default
# in May 2026, replacing PSTY19). It is STILL NOT the paper's exact stack. The paper benchmarks
# RR22 [43] (volePSI) + Waksman-in-BetaCircuit ShTr + alternating-moduli PCG + silent-OT-
# precomputed final OT; RR22 itself, the Waksman ShTr, and the silent-OT-precomputed final OT
# are not implemented yet. Closing each gap is tracked as a separate commit. See
# `07_ASIACCS:CSSW25/psty19_fallback.conf` for the explicitly labelled PSTY19 OPPRF+GMW fallback (our
# pre-May-2026 backend, kept for the RS21-vs-PSTY19 ablation).

server_name = server
server_ip = 127.0.0.1
server_port = 19002

client_name = client
client_ip = 127.0.0.1
client_port = 19003

append_string = fair_bench_2p5

pto_type = PSU

element_byte_length = 16
server_log_set_size = 5
client_log_set_size = 5
parallel = true

psu_pto_name = ASIACCS:CSSW25_PROXY

silent_cot = true
compress_encode = true
rosn_type = PKC:GMRSS21_NET
