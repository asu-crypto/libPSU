# Fair benchmark (2^6 = 64 x 64).
server_name = server
server_ip = 127.0.0.1
server_port = 19002

client_name = client
client_ip = 127.0.0.1
client_port = 19003

append_string = fair_bench_2p6

pto_type = PSU
element_byte_length = 16
server_log_set_size = 6
client_log_set_size = 6
parallel = true
skip_warmup = true
skip_gc = true

psu_pto_name = ASIACCS:CSSW25
# Default ASIACCS:CSSW25 is the runnable PSTY19 proxy. Set css25_paper_comparison = true
# only for the much slower RS21 comparison proxy.
silent_cot = true
compress_encode = true
rosn_type = LLL24_FLAT_NET
