# Fair benchmark (2^8 = 256 x 256).
# Server = small set (P0), client = large set (P1, learns union).
# Requires libmpc4j-native-tool (core COT / KKRT16 OPRF). No FHE.
# Fair compare: balanced 2^18 x 2^18 (same as other protocols in this tree).

server_name = server
server_ip = 127.0.0.1
server_port = 19002

client_name = client
client_ip = 127.0.0.1
client_port = 19003

append_string = fair_bench_2p8

pto_type = PSU

element_byte_length = 16
server_log_set_size = 8
client_log_set_size = 8
parallel = true
skip_warmup = true
skip_gc = true

psu_pto_name = EUROCRYPT:PisTri26

silent_cot = true
compress_encode = true
