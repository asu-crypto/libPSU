# HARNESS EXPERIMENT: balanced PSU protocol at unequal set sizes (not true UPSU).
# server = sender 2^20, client = receiver 2^10. May abort or be invalid — compare with care.

server_name = server
server_ip = 127.0.0.1
server_port = 19102

client_name = client
client_ip = 127.0.0.1
client_port = 19103

append_string = fair_bench_unbalanced_2p20x2p10

pto_type = ASIACCS:BlaAgu12

element_byte_length = 16
server_log_set_size = 20
client_log_set_size = 10
parallel = true
skip_warmup = true
skip_gc = true

ba12_pto_name = ASIACCS:BlaAgu12
ba12_operation = ASIACCS:BlaAgu12_UNION

silent_cot = true
ba12_log_stats = true
