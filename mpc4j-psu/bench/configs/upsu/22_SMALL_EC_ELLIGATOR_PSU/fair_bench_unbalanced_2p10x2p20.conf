# HARNESS EXPERIMENT: balanced PSU protocol at unequal set sizes (not true UPSU).
# server = sender 2^10, client = receiver 2^20. May abort or be invalid — compare with care.

server_name = server
server_ip = 127.0.0.1
server_port = 19206

client_name = client
client_ip = 127.0.0.1
client_port = 19207

append_string = fair_bench_unbalanced_2p10x2p20

pto_type = PSU

element_byte_length = 16
server_log_set_size = 10
client_log_set_size = 20
parallel = true
skip_warmup = true
skip_gc = true

psu_pto_name = Ours
small_ec_item_bit_length = 128
small_ec_log_stats = true
