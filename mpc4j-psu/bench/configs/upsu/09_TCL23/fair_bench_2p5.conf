# Fair benchmark (2^5 = 32 x 32).
# This balanced 2^18 x 2^18 config is for cross-protocol stress, not paper reproduction.
# Paper-aligned unbalanced config: upsu_fair_2p20_2p10/09_CCS:TCLZ23/fair_bench.conf
# Uses Tcl23PsuParams.forSizes — larger binNum than RECEIVER_16M_SENDER_MAX_1024 so |X| can be 262144.

server_name = server
server_ip = 127.0.0.1
server_port = 19002

client_name = client
client_ip = 127.0.0.1
client_port = 19003

append_string = fair_bench_2p5

pto_type = UPSU

element_byte_length = 16
server_log_set_size = 5
client_log_set_size = 5
parallel = true

psu_pto_name = CCS:TCLZ23
tcl23_pmpeqt = BYTE_ECC_DDH

silent_cot = true
compress_encode = true
