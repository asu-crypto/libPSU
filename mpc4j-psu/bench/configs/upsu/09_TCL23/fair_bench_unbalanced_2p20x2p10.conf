# Fair UPSU: sender 2^20 = 1048576, receiver 2^10 = 1024.
# server = sender (X), client = receiver (Y).

server_name = server
server_ip = 127.0.0.1
server_port = 19002

client_name = client
client_ip = 127.0.0.1
client_port = 19003

append_string = fair_bench_unbalanced_2p20x2p10

pto_type = UPSU

element_byte_length = 16
server_log_set_size = 20
client_log_set_size = 10
parallel = false
skip_warmup = true

# Legacy key supported by UpsuConfigUtils for benchmark compatibility.
psu_pto_name = CCS:TCLZ23
tcl23_pmpeqt = BYTE_ECC_DDH

silent_cot = true
compress_encode = true

