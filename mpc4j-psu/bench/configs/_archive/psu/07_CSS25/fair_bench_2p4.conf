# Fair benchmark (2^4 = 16 x 16).
# the paper's RR22 / volePSI backend) + LLL24 ROSN ShTr + Fig. 12 CnP + silent core-COT.
#
# Historical CSS25_PROXY conf kept for old output provenance. Active configs now use
# psu_pto_name = CSS25 with the runnable PSTY19 proxy by default; set
# css25_paper_comparison = true to opt into RS21. This is STILL NOT the paper's exact stack:
# RR22 [43] (volePSI), Waksman-in-BetaCircuit ShTr, alternating-moduli PCG, and the
# silent-OT-precomputed final OT are not implemented yet.

server_name = server
server_ip = 127.0.0.1
server_port = 19002

client_name = client
client_ip = 127.0.0.1
client_port = 19003

append_string = fair_bench_2p4

pto_type = PSU

element_byte_length = 16
server_log_set_size = 4
client_log_set_size = 4
parallel = true

psu_pto_name = CSS25_PROXY

silent_cot = true
compress_encode = true
rosn_type = GMR21_NET
