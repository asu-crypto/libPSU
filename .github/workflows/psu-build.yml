name: PSU-family build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile PSU stack
        run: mvn -pl mpc4j-psu -am package -DskipTests
      - name: Test PSU modules
        run: mvn -f mpc4j-psu/pom.xml -pl mpc4j-psu-tests test -Dmaven.test.skip=false -DfailIfNoTests=false
